# Mosquitto 2.x — auth required, no anonymous access.
# Bound to localhost (HA + govee2mqtt share the host network) and the LAN IP
# (for HASS.Agent on the gaming PC). Not on tailscale0, not port-forwarded.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
listener 1883 127.0.0.1
listener 1883 192.0.2.10   # placeholder (RFC 5737): the server's LAN IP
persistence true
persistence_location /mosquitto/data/
log_dest stdout
