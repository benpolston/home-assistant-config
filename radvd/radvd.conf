# Local-only IPv6 for the LAN (RFC 4193 ULA). Needed because Govee's Matter pairing requires "an IPv6 network"
# and the ISP provides none. AdvDefaultLifetime 0 = this host is NOT a default router, so devices never try to
# reach the internet over IPv6 through it. The prefix below is a placeholder: generate your own random RFC 4193 /48.
interface enp3s0 {
    AdvSendAdvert on;
    AdvDefaultLifetime 0;
    MinRtrAdvInterval 30;
    MaxRtrAdvInterval 100;
    prefix fd00:0:0:1::/64 {
        AdvOnLink on;
        AdvAutonomous on;
        AdvRouterAddr off;
        AdvValidLifetime 86400;
        AdvPreferredLifetime 14400;
    };
};
